<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
    <form name="form-suscripcion">
        <fieldset>
            <legend> Datos personales </legend>
            <p>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Nombre" maxlength="40" size="40" />
            </p>
            <p>
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" name="apellido" placeholder="Apellido" maxlength="40" size="40" />
            </p>
            <p>
                Sexo:
                <label for="sexo_masculino">Masculino</label>
                <input type="radio" id="sexo_masculino" name="sexo" value="masculino" checked />
                <label for="sexo_femenino">Femenino</label>
                <input type="radio" id="sexo_femenino" name="sexo" value="femenino" />
            </p>
            <p>
                <label for="edad">Edad:</label>
                <input type="number" id="edad" name="edad" placeholder="Edad" min="0" max="999" step="1" />
            </p>
        </fieldset>
        <fieldset>
            <legend> Datos de la cuenta </legend>
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="Email" maxlength="50" size="40" />
            </p>
            <p>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Usuario" maxlength="25" size="40" />
            </p>
            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" placeholder="Password" maxlength="25" size="40" />
            </p>
            <p>
                <label for="confirmar_password">Confirmar Password:</label>
                <input type="password" id="confirmar_password" name="confirmar_password"
                    placeholder="Confirmar Password" maxlength="25" size="40" />
            </p>
        </fieldset>
        <fieldset>
            <legend> Datos de suscripción </legend>
            <p>
                <label for="tipo_servicio">Tipo de servicio:</label>
                    <select id="tipo_servicio" name="tipo_servicio">
                        <option value="free">Free</option>
                        <option value="standard">Standard</option>
                        <option value="premium">Premium</option>
                    </select>
            </p>
            <p>
                Tema:
                <label for="tema_1">Política</label>
                <input type="checkbox" id="tema_1" name="tema_1" placeholder="Politica" />
                <label for="tema_2">Negocios</label>
                <input type="checkbox" id="tema_2" name="tema_2" placeholder="Negocios" />
                <label for="tema_3">Tecnología</label>
                <input type="checkbox" id="tema_3" name="tema_3" placeholder="Tecnología" />
                <label for="tema_4">Salud</label>
                <input type="checkbox" id="tema_4" name="tema_4" placeholder="Salud" /> <br />
            </p>

            <p>
                <label for="comentario">Agregue un comentario:</label>
                <textarea name="comentario" id="comentario" maxlength="150" placeholder="Deje su comentario..."></textarea>
            </p>
        </fieldset>
        <p><input type="submit" name="enviar" id="enviar" value="Enviar suscripción" /></p>
    </form>
</body>

</html>
