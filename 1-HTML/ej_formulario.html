<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>

<body>
    <!--Cree un Formulario con los campos que se proponen a continuacion-->
    <!--Agregue el atributo legend-->

    <!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

    <h3>
        <legend>
            Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!
        </legend>
    </h3>
    <form name="form-suscripcion">
        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" maxlength="50" />
        </p>
        <p>
            <label for="apellido">Apellido:</label>
            <input type="text" id="apellido" name="apellido" placeholder="Apellido" maxlength="50" />
        </p>
        <p>
            Sexo:
            <label for="sexo_masculino">Masculino</label>
            <input type="radio" id="sexo_masculino" name="sexo" value="masculino" checked />
            <label for="sexo_femenino">Femenino</label>
            <input type="radio" id="sexo_femenino" name="sexo" value="femenino" />
        </p>
        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="Edad" maxlength="3" />
        </p>
        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" maxlength="50" />
        </p>
        <p>
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" name="usuario" placeholder="Usuario" maxlength="25" />
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Password" maxlength="25" />
        </p>
        <p>
            <label for="confirmar_password">Confirmar Password:</label>
            <input type="password" id="confirmar_password" name="confirmar_password" placeholder="Confirmar Password" maxlength="25" />
        </p>
        <p>
            Tipo de servicio:
            <label>
            <select name="tipo_servicio">
                <option value="free">Free</option>
                <option value="standard">Standard</option>
                <option value="premium">Premium</option>
            </select>
            </label>
        </p>
        <p>
            Tema:
            <label for="tema_1">Política</label>
            <input type="checkbox" id="tema_1" name="tema_1" placeholder="Politica" /> Política
            <label for="tema_2">Negocios</label>
            <input type="checkbox" id="tema_2" name="tema_2" placeholder="Negocios" />Negocios
            <label for="tema_3">Tecnología</label>
            <input type="checkbox" id="tema_3" name="tema_3" placeholder="Tecnología" />Tecnología
            <label for="tema_4">Salud</label>
            <input type="checkbox" id="tema_4" name="tema_4" placeholder="Salud" />Salud <br />
        </p>

        <p>
            Agregue un comentario:
            <label for="comentario"></label>
            <textarea name="comentario" id="comentario" maxlength="150">
            Deje su comentario...
            </textarea>
        </p>
        <label for="enviar">Boton de enviar</label>
        <button name="enviar" id="enviar">Boton de enviar</button>
    </form>
</body>

</html>
