<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouTube</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      .videos .card {
        width: 50%;
        transition: transform 0.1s ease;
      }
      .videos .card:hover {
        transform: scale(1.05);
        z-index: 1;
      }
      .acciones {
        visibility: hidden;
      }
      .card:hover .acciones {
        visibility: visible;
      }
      @media (max-width: 600px) {
        .videos {
          flex-direction: column;
        }
        .videos .card {
          width: 100%;
        }
        .acciones {
          visibility: visible;
        }
      }
    </style>
  </head>
  <body>
    <main class="container my-5">
      <h1 class="visually-hidden">Videos de Taller de Desarrollo Web</h1>
      <div class="videos d-flex gap-2 align-items-center">
        <article class="card text-bg-dark border-0">
          <img
            class="card-img-top"
            src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png"
            alt="Tigre blanco"
          />
          <div class="card-body">
            <div class="d-flex gap-3">
              <img
                class="rounded-circle align-self-start"
                src="../2-CSS/imagenes/icono_usuario.jpg"
                width="35"
                alt="Avatar del canal"
              />
              <div>
                <h2 class="card-title fs-6">
                  Taller de Desarrollo Web - VaciarCarrito y EliminarProducto
                </h2>
                <p class="text-secondary small">
                  Taller de Desarrollo Web - Otro Ejercicio<br />230 vistas - 1
                  día
                </p>
              </div>
            </div>
            <div class="acciones d-flex justify-content-around">
              <button class="btn btn-outline-light btn-sm" type="button">
                VER MÁS TARDE</button
              ><button class="btn btn-outline-light btn-sm" type="button">
                AGREGAR A LA FILA
              </button>
            </div>
          </div>
        </article>
        <article class="card text-bg-dark border-0">
          <img
            class="card-img-top"
            src="https://ucc-tallerdesarrolloweb.github.io/filminas/images/ejercicios/satoshito89_01.png"
            alt="Tigre blanco"
          />
          <div class="card-body">
            <div class="d-flex gap-3">
              <img
                class="rounded-circle align-self-start"
                src="../2-CSS/imagenes/icono_usuario.jpg"
                width="35"
                alt="Avatar del canal"
              />
              <div>
                <h2 class="card-title fs-6">
                  Taller de Desarrollo Web - VaciarCarrito y EliminarProducto
                </h2>
                <p class="text-secondary small">
                  Taller de Desarrollo Web - Otro Ejercicio<br />230 vistas - 1
                  día
                </p>
              </div>
            </div>
            <div class="acciones d-flex justify-content-around">
              <button class="btn btn-outline-light btn-sm" type="button">
                VER MÁS TARDE</button
              ><button class="btn btn-outline-light btn-sm" type="button">
                AGREGAR A LA FILA
              </button>
            </div>
          </div>
        </article>
      </div>
    </main>
  </body>
</html>
