<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style></style>
  </head>
  <body>
    <main class="container my-5">
      <article class="card mx-auto text-center" style="max-width: 300px">
        <img
          class="card-img-top"
          src="images/fondo_mario.jpg"
          alt="Portada de perfil"
        />
        <div class="card-body pt-0">
          <img
            class="rounded-circle position-relative"
            style="margin-top: -45px"
            src="../2-CSS/imagenes/icono_usuario.jpg"
            alt="Foto de perfil"
            width="100"
          />
          <h1 class="card-title fs-5">Octavio Albarracin</h1>
          <p class="card-text">
            Estudiante de Licenciatura en Bioinformática. Universidad Católica
            de Córdoba.
          </p>
          <button class="btn btn-primary" type="button">Ver perfil</button>
        </div>
        <ul class="list-group list-group-flush text-start">
          <li class="list-group-item">✉ Ir a mensajes</li>
          <li class="list-group-item">
            ♧ Notificaciones <span class="badge bg-danger">+99</span>
          </li>
          <li class="list-group-item">♙ Solicitudes pendientes</li>
          <li class="list-group-item">☎ Llamar</li>
        </ul>
      </article>
    </main>
  </body>
</html>
