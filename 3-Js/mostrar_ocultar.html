<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Mostrar/Ocultar Div</title>

    <link href="https://fonts.googleapis.com/css?family=Inknut+Antiqua" rel="stylesheet">
    <link href="miEstilo.css" type="text/css" rel="stylesheet">

    <script type="text/javascript" src="misFunciones.js"></script>
</head>

<body>

    <h1>Mostrar/Ocultar Div</h1>

    <form>
        <!-- Los dos radio button tienen el mismo name porque pertenecen al mismo grupo -->
        <!-- Si uno se selecciona, el otro se deselecciona -->

        <p>
            <input
                id="mostrarDiv"
                type="radio"
                name="rad_mostrar-ocultar"
                value="val_mostrar"
                onclick="mostrarOcultar(this.value)"
            >
            <label for="mostrarDiv">Mostrar Div</label>
        </p>

        <p>
            <input
                id="ocultarDiv"
                type="radio"
                name="rad_mostrar-ocultar"
                value="val_ocultar"
                onclick="mostrarOcultar(this.value)"
            >
            <label for="ocultarDiv">Ocultar Div</label>
        </p>
    </form>

    <div id="unDiv" class="color-div">
        <p>
            Este DIV contiene información que en ciertas ocasiones se desea ocultar.
        </p>
    </div>

</body>

</html>
