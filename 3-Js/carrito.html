<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Carrito de Compras</title>
    <link rel="stylesheet" type="text/css" href="catalogos.css">
    <script type="text/javascript" src="tienda.js"></script>
</head>

<body class="grid-container" onload="mostrarCarrito()">

    <header class="item1">
        Carrito de Compras
    </header>

    <nav class="item2">
        <a href="productos.html">Catálogo de Productos</a>
        <a href="carrito.html">
            Carrito de Compras (<span id="cantidad-carrito">0</span>)
        </a>
    </nav>
    <aside class="item3">
        <h2>Resumen de compra</h2>

        <p>
            Cantidad de productos:
            <strong id="cantidad-total">0</strong>
        </p>

        <p>
            Total a pagar:
            <strong id="total-pagar">$0,00</strong>
        </p>

        <button
            type="button"
            id="vaciar-carrito"
            onclick="vaciarCarrito()"
        >
            Vaciar el carrito
        </button>
    </aside>
    <main class="item4" id="carrito"></main>

    <footer class="item5">
        Contacto:
    </footer>

</body>
</html>
