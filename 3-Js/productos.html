<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Catálogo de Productos</title>
    <link rel="stylesheet" type="text/css" href="catalogos.css">
    <script type="text/javascript" src="tienda.js"></script>
</head>

<body class="grid-container" onload="mostrarCatalogo()">

    <header class="item1">
        Catálogo de Productos
    </header>

    <nav class="item2">
        <a href="productos.html">Catálogo de Productos</a>
        <a href="">Carrito de Compras</a>
    </nav>

    <aside class="item3">
        <form name="filter" id="filter">

            <fieldset>
                <legend>Buscador</legend>

                <label for="search">Buscar</label>
                <input
                    type="text"
                    name="search"
                    id="search"
                    placeholder="Buscar"
                >
            </fieldset>

            <fieldset>
                <legend>Precios</legend>

                <p>
                    <label for="price-min">Mínimo</label>
                    <input
                        type="number"
                        name="price-min"
                        id="price-min"
                        min="0"
                    >
                </p>

                <p>
                    <label for="price-max">Máximo</label>
                    <input
                        type="number"
                        name="price-max"
                        id="price-max"
                        min="0"
                    >
                </p>
            </fieldset>

            <fieldset>
                <legend>Tipo de Producto</legend>

                <p>
                    <input
                        type="checkbox"
                        name="tipo"
                        id="protectores"
                        value="protectores"
                    >
                    <label for="protectores">Protectores</label>
                </p>

                <p>
                    <input
                        type="checkbox"
                        name="tipo"
                        id="entrenamiento"
                        value="entrenamiento"
                    >
                    <label for="entrenamiento">Entrenamiento</label>
                </p>

                <p>
                    <input
                        type="checkbox"
                        name="tipo"
                        id="dobok"
                        value="dobok"
                    >
                    <label for="dobok">Dobok</label>
                </p>
            </fieldset>

        </form>
    </aside>

    <dialog id="modal">
        <h2>Cabezal cerrado</h2>
        <p>
            El cabezal cerrado es un equipo de protección utilizado
            en deportes de contacto.
        </p>
        <button type="button" onclick="cerrarModal()">
            Cerrar
        </button>
    </dialog>

    <main class="item4" id="catalogo"></main>

    <footer class="item5">
        Contacto:
    </footer>

</body>
</html>
